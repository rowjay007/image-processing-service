version: '3'

tasks:
  build:
    desc: Build all binaries
    cmds:
      - go build -o bin/api cmd/api/main.go
      - go build -o bin/worker cmd/worker/main.go
      - go build -o bin/migrate cmd/migrate/main.go
      - go build -o bin/auth cmd/auth/main.go

  run:api:
    desc: Run the API server
    cmds:
      - AUTH_SERVICE_ADDR=localhost:50051 go run cmd/api/main.go

  run:worker:
    desc: Run the background worker
    cmds:
      - AUTH_SERVICE_ADDR=localhost:50051 go run cmd/worker/main.go

  run:auth:
    desc: Run the standalone Auth service
    cmds:
      - go run cmd/auth/main.go

  db:migrate:
    desc: Run database migrations
    cmds:
      - go run cmd/migrate/main.go

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test:ci:
    desc: Run tests for CI with coverage
    cmds:
      - go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./... --timeout=5m

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f coverage.txt
      - rm -rf api/gen/

  proto:generate:
    desc: Generate Go code from Protobuf definitions (using Buf)
    cmds:
      - mkdir -p api/gen/go
      - docker run --rm -v $(pwd):/workspace -w /workspace bufbuild/buf generate
